<!doctype html>
<html lang="pt-BR">
  <head <link rel="stylesheet" href="style.css">
>
    <meta charset="UTF-8" />
    <title>Elden Ring - Armas Lendárias</title>
      <style>
      /* Reset básico e unificado */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box; /* Garante que padding e border não quebrem o tamanho calculado */
      }

      body {
        min-height: 100vh;
        font-family: sans-serif;
        position: relative; /* Necessário para ancorar o fundo transparente */
        background-color: rgb(
          70,
          70,
          72
        ); /* Cor de fundo caso a imagem falhe */
        overflow-x: hidden;
      }

      /* Camada da imagem de fundo com transparência */
      /* Camada da imagem de fundo com transparência */
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

        /* COLOQUE O CAMINHO DO SEU ARQUIVO LOCAL AQUI: */
        background-image: url("../flex-box-copy-2/imgselden-ring/malenia-fundo.jpg");

        background-size: cover; /* Faz a imagem cobrir a tela inteira */
        background-position: center; /* Centraliza a imagem */
        background-attachment: fixed; /* Mantém o fundo fixo ao rolar a página */
        opacity: 0.25; /* Controla a transparência (0.0 a 1.0) */
        z-index: -1; /* Joga a imagem para trás de todo o conteúdo */
      }

      header {
        height: 80px;
        background-color: blue;
        display: flex;
        align-items: center;
      }

      .logo-navegacao {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
      }

      .logo-cabecalho {
        width: 80px;
        height: auto;
      }

      .menu-links a {
        color: white;
        text-decoration: none;
        margin-left: 15px;
        font-weight: bold;
      }

      .menu-links a:hover {
        text-decoration: underline;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }

      /* Um único contêiner inteligente que quebra linhas sozinho */
      .container {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        width: 100%;
        max-width: 1000px;
        background-color: white;
        padding: 20px;
        border-radius: 8px;
      }

      .cards {
        border: 1px solid orange;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        width: 200px;
        height: 230px;
        background-color: #ffffff0e;
        border-radius: 10px;
      }

      .img-card {
        width: 150px;
        height: 170px;
        object-fit: cover; /* Evita que a imagem fique distorcida */
      }

      .cards p {
        font-weight: bold;
        color: #333;
      }

      /* --- Novo estilo para os botões do menu --- */
      .menu-links {
        display: flex;
        gap: 10px; /* Espaçamento padrão entre os botões */
        align-items: center;
      }

      /* 1. Botão Padrão (Sem preenchimento / Outline) */
      .menu-links a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        padding: 8px 16px;
        border: 2px solid transparent; /* Reserva o espaço da borda */
        border-radius: 20px; /* Bordas arredondadas estilo pílula */
        transition: all 0.3s ease; /* Transição suave de cores */
      }

      /* Efeito ao passar o mouse no botão padrão */
      .menu-links a:hover {
        background-color: rgba(255, 255, 255, 0.2); /* Fundo sutil */
        border-color: white; /* Borda branca aparece */
      }

      /* 2. Botão de Destaque (Preenchido / Contained) */
      .menu-links a.destaque {
        background-color: #ff9800; /* Laranja chamativo */
        color: #1a1a1a;
        border-color: #ff9800;
      }

      /* Efeito ao passar o mouse no botão de destaque */
      .menu-links a.destaque:hover {
        background-color: #e68a00;
        border-color: #e68a00;
        color: white;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-navegacao">
        <img src="../flex-box copy/imgselden-ring/logo-elden-ring.jpg" class="logo-cabecalho" />
        <nav class="menu-links">
          <a href="index.html">Home</a>
          <a href="chefes.html">Chefes</a>
          <a href="classes.html">Classes</a>
          <a href="armas.html" class="active">Armas</a>
          <a href="lore.html" class="destaque">História/Lore</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="texto-intro">
        <h1>Arsenal de Guerra</h1>
        <p>As melhores espadas, cajados e machados para esmagar os inimigos.</p>
      </div>
      <div class="container">
        <div class="cards">
          <img src="../atividade-css-1/imgselden-ring/Elden-002.jpg" alt="Espada" class="img-card"  width="150px"
            height="170px"/>
          <p>Lâmina de Blasphemous</p>
        </div>
        <div class="cards">
          <img src="../atividade-css-1/imgselden-ring/Elden-003.jpg" alt="Katana" class="img-card"  width="150px"
            height="170px"/>
          <p>Rivers of Blood</p>
        </div>
      </div>
    </main>
  </body>
</html>
