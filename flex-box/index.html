<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex box</title>

    <style>
      :root {
        --altura-cabecalho: 80px;
        --cor-tema-padrao-1: yellow;
        --cor-tema-secundaria: white;
      }

      * {
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
      body {
        height: 80vh;
        background-color: rgb(218, 213, 213);
      }
      .container {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        background-color: white;
        gap: 10px;
        width: 80%;
      }
      .cards {
        border: 1px solid orange;
        height: 200px;
        width: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* background-color: orange; */
      }

      .main {
        display: flex;
        flex-direction: column;
        gap: 50px;
        /* justify-content: center; */
        align-items: center;
        height: calc(100vh - var(--altura-cabecalho));
        /* border: 1px solid green; */
      }
      .img-card {
        width: 150px;
      }
      header {
        height: var(--altura-cabecalho);
        background-color: var(--cor-tema-padrao-1);
      }
      .logo-cabecalho {
        width: 80px;
      }
      .logo-navegacao {
        width: 50%;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding-left: 30px;
      }

      footer {
        background-color: var(--cor-tema-secundaria);
        height: 50px;
      }
    </style>
  </head>
