    <title>Flex box</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
      body {
        height: 100vh;
        background-color: white;
      }
      .container {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        background-color: white;
        gap: 10px;
        width: 80%;
      }
      .cards {
        border: 1px solid orange;
        height: 200px;
        width: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* background-color: orange; */
      }

      .main {
        display: flex;
        flex-direction: column;
        gap: 50px;
        /* justify-content: center; */
        align-items: center;
        height: 100vh;
        /* border: 1px solid green; */
      }
      .img-card {
        width: 150px;
      }
      .header {
        height: 80px;
        background-color: blue;
      }
      .logo-cabecalho {
        width: 80px;
      }
      .logo-navegacao {
        width: 50%;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding-left: 30px;
      }
    </style>
  </head>
